services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: q
      POSTGRES_DB: q
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - q-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q -d q"]
      interval: 2s
      retries: 15

volumes:
  q-pgdata:
