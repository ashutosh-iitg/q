[project]
name = "q"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "openai>=3.37.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]
